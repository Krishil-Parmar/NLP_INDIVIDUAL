[project]
name = "router"
version = "0.1.0"
description = "Router Before the LLM: a cost-aware intent router for a personal finance assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.2.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "protobuf==7.36.2",
    "pyyaml==6.0.4",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.3.0",
    "sentencepiece==0.2.3",
    "torch==2.15.0",
    "transformers==5.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "pytest==9.2.0",
]
llm = [
    "anthropic[bedrock]==1.17.0",
]
