# S4 retrieval variant (post-hoc, VALIDATION ONLY; owner approval 24 Nov 2026, about US$2).
# Asked by the second independent review: is few-shot S4 a weak bar? Same model and settings as
# configs/s4_llm_fewshot.yaml, but instead of 2 fixed examples per intent, each query's user message
# carries its retrieval_k most similar TRAIN queries (S2's encoder, cosine) with their labels, so the
# LLM sees the same kind of evidence as the routers. scripts/run_s4.py refuses any split but val for it.
# Fixed before any call: k = 10, the prompt in prompts/s4_intent_retrieval_v1.txt.

aws_profile: unibucks
aws_region: ap-southeast-2
# Jeff's production model (Velm infrastructure/cdk/stacks/api_stack.py): Claude Sonnet 4.6 through the
# Australian cross-region inference profile, so requests run in ap-southeast-2 / ap-southeast-4 only.
model_id: au.anthropic.claude-sonnet-4-6
system_tag: s4_claude-sonnet-4-6-retrieval

prompt_file: prompts/s4_intent_retrieval_v1.txt
prompt_version: retrieval_v1
retrieval_k: 10                # most similar train queries shown with each query
retrieval_encoder: sentence-transformers/all-MiniLM-L6-v2   # S2's encoder
oos_answer: out_of_scope    # the answer the prompt asks for when no intent fits; mapped to the "oos" label
structured_output: true     # JSON answer restricted to the 78 allowed values; false = plain-text answer, checked against the list

temperature: 0              # rigour rule 7. Sent through extra_body: SDK 1.x has no temperature argument, Sonnet 4.6 still honours it
max_tokens: 64

# US dollars per million tokens. Source: AWS Price List API, service AmazonBedrockFoundationModels,
# region ap-southeast-2, "Claude Sonnet 4.6", regional (au.) on-demand rates, checked 22 Nov 2026.
prices_usd_per_million_tokens:
  input: 3.30
  output: 16.50
  cache_write: 4.125
  cache_read: 0.33
price_checked: "2026-11-22"

spend_cap_usd: 12.55         # hard stop, counted over every call in all the budget cache files below.
                             # Lower than the other S4 configs' 13.20 on purpose: US$10.05 was spent before this
                             # experiment, and the owner approved about US$2 for it (24 Nov 2026), so it may add
                             # at most US$2.50. If it stops early, the owner is asked before any more is spent.
requests_per_minute: 45      # account quota is 50 per minute for this model and profile
max_workers: 4               # calls in flight at once (the rate limit still applies)
sdk_max_retries: 4           # the SDK retries throttling (429) and server errors with backoff

cache_file: results/s4_cache/claude-sonnet-4-6_retrieval_v1.jsonl
budget_cache_files:          # every S4 variant's spend counts toward the one cap
  - results/s4_cache/claude-sonnet-4-6_v1.jsonl
  - results/s4_cache/claude-sonnet-4-6_fewshot_v1.jsonl
  - results/s4_cache/claude-sonnet-4-6_jeff_v1.jsonl
  - results/s4_cache/claude-sonnet-4-6_jeff_fewshot_v1.jsonl
  - results/s4_cache/claude-sonnet-4-6_retrieval_v1.jsonl
