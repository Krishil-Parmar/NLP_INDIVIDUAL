# Data and preprocessing settings (README section 6 and 6.2).
# Every system reads its data through the splits this config produces.
# Changing anything here means re-running scripts/make_splits.py --force,
# which is only allowed before any test-set run.

seed: 42             # fixed seed for the validation split
val_fraction: 0.10   # share of Banking77 train carved off as validation

banking77:
  hub_id: PolyAI/banking77
  revision: 1846984189f2bc0ac51c6fc3a600fa9e1714e0c6   # checked 22 Nov 2026
  expected_sizes: {train: 10003, test: 3080}           # from the Hub dataset card

clinc150:
  hub_id: clinc/clinc_oos
  config: plus     # the "plus" variant: 250 OOS train, 100 OOS validation, 1000 OOS test
  revision: 155b9c710419136e17307b80d0a13e68cd46b4ec   # checked 22 Nov 2026
  oos_label: oos   # OOS rows are found by this intent name, never by a numeric index
  expected_oos_sizes: {train: 250, validation: 100, test: 1000}

# Which CLINC150 OOS splits go into our validation and test OOS pools (step 8).
# Validation pool uses CLINC OOS train + validation so the OOS share in our
# validation set (~26%) roughly matches the test set (~25%).
# This is only legitimate because no system trains on OOS data.
oos_pools:
  val: [train, validation]
  test: [test]

# Tokenisers for the length check (step 6). These three cover every
# candidate checkpoint for S1, S2 and S3 (RoBERTa BPE, DeBERTa-v3
# SentencePiece, BERT WordPiece).
tokenisers:
  - distilbert/distilroberta-base
  - microsoft/deberta-v3-small
  - sentence-transformers/all-MiniLM-L6-v2

# max_length = this percentile of train token lengths, rounded up to a multiple of 8
length_percentile: 99
